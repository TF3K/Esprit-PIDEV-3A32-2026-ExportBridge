# config/services.yaml
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\OAuthStorageService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Security\GoogleOAuthUserProvider:
        arguments:
            $oauthStorage: '@App\Service\OAuthStorageService'

    App\Service\EmailValidationService:
        arguments:
            $apiKey: '%env(EMAIL_VALIDATION_API_KEY)%'
            $apiBaseUrl: '%env(default::EMAIL_VALIDATION_API_URL)%'